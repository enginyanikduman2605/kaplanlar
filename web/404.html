 <!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #111318;
            color: #e5e7eb;
            font-family: system-ui, sans-serif;
            text-align: center;
        }

        main {
            padding: 2rem;
        }

        h1 {
            margin: 0;
            font-size: clamp(5rem, 15vw, 9rem);
            letter-spacing: -0.08em;
            color: #8b9cff;
        }

        p {
            color: #a1a1aa;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            background: #8b9cff;
            color: #111318;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            background: #aab5ff;
        }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <h2>Sayfa bulunamadı</h2>
        <p>Aradığınız sayfa mevcut değil.</p>
        <a href="/">Eve dön</a>
    </main>
</body>
</html>
